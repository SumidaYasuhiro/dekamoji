<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>でか文字</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #ffffff;
      color: #000000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
    }

    #message {
      width: 100%;
      max-width: 1000px;

      text-align: center;

      font-size: clamp(48px, 10vw, 140px);
      font-weight: 700;
      line-height: 1.4;

      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    #error {
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="message">読み込み中...</div>

  <script>
    const messageElement = document.getElementById("message");

    fetch("message.txt?t=" + Date.now())
      .then(response => {
        if (!response.ok) {
          throw new Error("読み込みエラー");
        }

        return response.text();
      })
      .then(text => {
        messageElement.textContent = text.trim();
      })
      .catch(error => {
        messageElement.textContent = "メッセージを読み込めませんでした";
        console.error(error);
      });
  </script>

</body>
</html>
