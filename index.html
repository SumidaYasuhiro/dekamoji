<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>でか文字</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      width: 100vw;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      overflow: hidden;

      background: #ffffff;
      color: #000000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;
    }

    #message {
      width: 100%;

      text-align: center;

      font-size: 48px;
      font-weight: 700;
      line-height: 1.35;

      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: normal;
    }
  </style>
</head>

<body>

  <div id="message">読み込み中...</div>

  <script>
    const messageElement = document.getElementById("message");

    function fitText() {

      let size = 48;
      const minSize = 32;

      messageElement.style.fontSize = size + "px";

      while (
        (
          messageElement.scrollHeight > window.innerHeight - 48 ||
          messageElement.scrollWidth > window.innerWidth - 48
        )
        &&
        size > minSize
      ) {
        size--;
        messageElement.style.fontSize = size + "px";
      }
    }

    fetch("message.txt?t=" + Date.now())
      .then(response => {

        if (!response.ok) {
          throw new Error("読み込みエラー");
        }

        return response.text();
      })
      .then(text => {

        messageElement.textContent = text.trim();

        fitText();
      })
      .catch(error => {

        messageElement.textContent =
          "メッセージを読み込めませんでした";

        console.error(error);
      });

    window.addEventListener("resize", fitText);
  </script>

</body>
</html>
