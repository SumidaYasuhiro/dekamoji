name: Deploy to XServer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          PRIVATE_KEY: ${{ secrets.XSERVER_PRIVATE_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          PORT: ${{ secrets.XSERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      
          for i in 1 2 3 4 5; do
            if ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts; then
              echo "ssh-keyscan succeeded."
              break
            fi
      
            echo "ssh-keyscan failed. retry $i/5..."
            
            if [ "$i" -eq 5 ]; then
              echo "ssh-keyscan failed after 5 attempts."
              exit 1
            fi
      
            sleep 5
          done

      - name: Deploy to XServer
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER: ${{ secrets.XSERVER_USER }}
          PORT: ${{ secrets.XSERVER_PORT }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
              -P "$PORT" \
              index.html \
              message.txt \
              icon_.png \
              "$USER@$HOST:~/polaris-x.co.jp/public_html/dekamoji/"
